name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Verification harness
        run: npm run verify

      - name: Create CLI archives
        run: |
          mkdir -p release/local-deck-ai
          cp -R dist public README.md LICENSE package.json release/local-deck-ai/
          tar -czf "local-deck-ai-${GITHUB_REF_NAME}.tar.gz" -C release local-deck-ai
          (cd release && zip -qr "../local-deck-ai-${GITHUB_REF_NAME}.zip" local-deck-ai)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            local-deck-ai-${{ github.ref_name }}.tar.gz
            local-deck-ai-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
